name: Free iOS Simulator Preview

run-name: "iPhone Simulator Preview #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Project folder relative to repository root
        required: false
        default: .
        type: string
      scheme:
        description: Main application target (leave empty to auto-detect)
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ios-simulator-preview
  cancel-in-progress: true

jobs:
  simulator-preview:
    name: Run app in iPhone Simulator and capture every screen
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Detect Xcode project
        id: detect
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail

          if [[ -z "${PROJECT_PATH// }" ]]; then PROJECT_PATH="."; fi
          ROOT="$GITHUB_WORKSPACE/$PROJECT_PATH"

          if [[ ! -d "$ROOT" ]]; then
            echo "::error::Project directory not found: $ROOT"
            exit 1
          fi

          APP_PROJECT=$(find "$ROOT" -maxdepth 5 \
            -name '*.xcodeproj' \
            -not -path '*/Pods/*' \
            -not -path '*/.build/*' \
            -print -quit)

          if [[ -z "$APP_PROJECT" ]]; then
            echo "::error::No Xcode project found in $ROOT"
            exit 1
          fi

          echo "app_project=$APP_PROJECT" >> "$GITHUB_OUTPUT"
          echo "ios_dir=$(dirname "$APP_PROJECT")" >> "$GITHUB_OUTPUT"
          echo "Detected project: $APP_PROJECT"

          xcodebuild -list -project "$APP_PROJECT" || true

      - name: Install tools and dependencies
        id: deps
        shell: bash
        env:
          IOS_DIR: ${{ steps.detect.outputs.ios_dir }}
          APP_PROJECT: ${{ steps.detect.outputs.app_project }}
        run: |
          set -euo pipefail

          sudo gem install xcodeproj

          KIND="project"
          CONTAINER="$APP_PROJECT"

          if [[ -f "$IOS_DIR/Podfile" ]]; then
            sudo gem install cocoapods
            pod install --project-directory="$IOS_DIR"
            WS=$(find "$IOS_DIR" -maxdepth 1 -name '*.xcworkspace' -print -quit)
            if [[ -n "$WS" ]]; then
              KIND="workspace"
              CONTAINER="$WS"
            fi
          fi

          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Create screenshot UI test target
        shell: bash
        env:
          APP_PROJECT: ${{ steps.detect.outputs.app_project }}
          APP_TARGET: ${{ inputs.scheme }}
        run: |
          set -euo pipefail

          TESTS_DIR="$(dirname "$APP_PROJECT")/PreviewUITests"
          mkdir -p "$TESTS_DIR"

          cat > "$TESTS_DIR/ScreenshotTests.swift" <<'SWIFT'
          import XCTest

          final class ScreenshotTests: XCTestCase {

              let app = XCUIApplication()

              let maxShots = 40
              let maxDepth = 3
              let limits = [8, 5, 3]
              let deadline = Date().addingTimeInterval(20 * 60)

              var counter = 0
              var seen = Set<Int>()
              var dirs: [URL] = []
              var indexLines: [String] = []

              let blocked = [
                  "delete", "remove", "sign out", "log out", "logout",
                  "reset", "erase", "back", "close", "cancel", "done",
                  "حذف", "مسح", "إزالة", "خروج", "تسجيل الخروج",
                  "رجوع", "إغلاق", "إلغاء", "تم", "إعادة ضبط"
              ]

              override func setUp() {
                  super.setUp()
                  continueAfterFailure = true

                  var candidates = [
                      URL(fileURLWithPath: "/tmp/PreviewScreenshots", isDirectory: true)
                  ]

                  if let docs = FileManager.default.urls(
                      for: .documentDirectory,
                      in: .userDomainMask
                  ).first {
                      candidates.append(
                          docs.appendingPathComponent("PreviewScreenshots", isDirectory: true)
                      )
                  }

                  for url in candidates {
                      try? FileManager.default.removeItem(at: url)
                      do {
                          try FileManager.default.createDirectory(
                              at: url,
                              withIntermediateDirectories: true
                          )
                          dirs.append(url)
                      } catch {
                          print("DIR_FAILED: \(url.path)")
                      }
                  }

                  addUIInterruptionMonitor(withDescription: "System alerts") { alert in
                      for name in ["Allow", "Allow While Using App", "Allow Once", "OK", "Continue"] {
                          let button = alert.buttons[name]
                          if button.exists {
                              button.tap()
                              return true
                          }
                      }
                      return false
                  }
              }

              func pause(_ seconds: Double = 1.0) {
                  Thread.sleep(forTimeInterval: seconds)
              }

              func launch() {
                  if app.state != .notRunning {
                      app.terminate()
                  }
                  app.launch()
                  pause(3)
              }

              @discardableResult
              func snap(_ slug: String, _ title: String) -> Bool {
                  guard counter < maxShots else { return false }

                  pause(1.0)

                  let shot = XCUIScreen.main.screenshot()
                  let data = shot.pngRepresentation
                  let hash = data.hashValue

                  if seen.contains(hash) { return false }
                  seen.insert(hash)

                  counter += 1
                  let name = String(format: "%02d-%@", counter, slug)

                  for dir in dirs {
                      try? data.write(
                          to: dir.appendingPathComponent(name + ".png"),
                          options: .atomic
                      )
                  }

                  let attachment = XCTAttachment(screenshot: shot)
                  attachment.name = name
                  attachment.lifetime = .keepAlways
                  add(attachment)

                  let clean = title
                      .replacingOccurrences(of: "|", with: " ")
                      .replacingOccurrences(of: "\n", with: " ")
                  indexLines.append("\(name)|\(clean)")

                  let text = indexLines.joined(separator: "\n") + "\n"
                  for dir in dirs {
                      try? text.write(
                          to: dir.appendingPathComponent("index.txt"),
                          atomically: true,
                          encoding: .utf8
                      )
                  }

                  print("SCREENSHOT_SAVED: \(name)")
                  return true
              }

              func isBlocked(_ label: String) -> Bool {
                  let lower = label.lowercased()
                  return blocked.contains { lower == $0 || lower.hasPrefix($0 + " ") }
              }

              func apply(_ step: String) -> Bool {
                  let kind = String(step.prefix(2))
                  let value = String(step.dropFirst(2))

                  switch kind {
                  case "t:":
                      let button = app.tabBars.buttons[value]
                      guard button.waitForExistence(timeout: 4), button.isHittable else {
                          return false
                      }
                      button.tap()

                  case "i:":
                      let index = Int(value) ?? 0
                      let buttons = app.tabBars.buttons
                      guard index < buttons.count else { return false }
                      let button = buttons.element(boundBy: index)
                      guard button.exists, button.isHittable else { return false }
                      button.tap()

                  case "b:":
                      let button = app.buttons.matching(
                          NSPredicate(format: "label == %@", value)
                      ).firstMatch
                      guard button.waitForExistence(timeout: 3), button.isHittable else {
                          return false
                      }
                      button.tap()

                  case "c:":
                      let index = Int(value) ?? 0
                      guard index < app.cells.count else { return false }
                      let cell = app.cells.element(boundBy: index)
                      guard cell.exists, cell.isHittable else { return false }
                      cell.tap()

                  default:
                      return false
                  }

                  pause(1.5)
                  return true
              }

              func reach(_ path: [String]) -> Bool {
                  launch()
                  for step in path {
                      if !apply(step) { return false }
                  }
                  return true
              }

              func candidates(tabLabels: Set<String>) -> [String] {
                  var result: [String] = []
                  var used = Set<String>()

                  for button in app.buttons.allElementsBoundByIndex.prefix(40) {
                      guard button.exists, button.isHittable else { continue }

                      let label = button.label
                          .trimmingCharacters(in: .whitespacesAndNewlines)

                      if label.isEmpty || tabLabels.contains(label)
                          || isBlocked(label) || used.contains(label) {
                          continue
                      }

                      used.insert(label)
                      result.append("b:" + label)
                  }

                  let cellCount = min(app.cells.count, 5)
                  for index in 0..<cellCount {
                      let cell = app.cells.element(boundBy: index)
                      guard cell.exists, cell.isHittable else { continue }
                      if isBlocked(cell.label) { continue }
                      result.append("c:\(index)")
                  }

                  return result
              }

              func describe(_ step: String) -> String {
                  let value = String(step.dropFirst(2))
                  if step.hasPrefix("c:") { return "صف رقم \(Int(value).map { $0 + 1 } ?? 1)" }
                  return value
              }

              func explore(
                  path: [String],
                  slug: String,
                  title: String,
                  depth: Int,
                  tabLabels: Set<String>
              ) {
                  guard depth < maxDepth, counter < maxShots, Date() < deadline else {
                      return
                  }

                  guard reach(path) else { return }

                  let found = candidates(tabLabels: tabLabels)
                  let letters = ["a", "b", "c"]

                  var needReach = false

                  for (offset, step) in found.prefix(limits[depth]).enumerated() {
                      guard counter < maxShots, Date() < deadline else { return }

                      if needReach {
                          guard reach(path) else { continue }
                      }
                      needReach = true

                      guard apply(step) else { continue }

                      let childSlug = "\(slug)-\(letters[depth])\(offset + 1)"
                      let childTitle = "\(title) › \(describe(step))"

                      if snap(childSlug, childTitle) {
                          explore(
                              path: path + [step],
                              slug: childSlug,
                              title: childTitle,
                              depth: depth + 1,
                              tabLabels: tabLabels
                          )
                      }
                  }
              }

              func testCaptureApplicationScreens() {
                  launch()
                  snap("launch", "شاشة البداية")

                  let labels = app.tabBars.buttons.allElementsBoundByIndex.map { $0.label }
                  let tabSet = Set(labels.filter { !$0.isEmpty })

                  if labels.isEmpty {
                      app.swipeUp()
                      snap("main-scroll", "الشاشة الرئيسية بعد التمرير")

                      explore(
                          path: [],
                          slug: "main",
                          title: "الشاشة الرئيسية",
                          depth: 0,
                          tabLabels: tabSet
                      )
                  } else {
                      for (index, label) in labels.enumerated() {
                          let step = label.isEmpty ? "i:\(index)" : "t:" + label
                          let title = label.isEmpty ? "تبويب \(index + 1)" : "صفحة \(label)"
                          let slug = "tab\(index + 1)"

                          guard reach([step]) else { continue }

                          snap(slug, title)

                          app.swipeUp()
                          snap(slug + "-scroll", title + " بعد التمرير")

                          explore(
                              path: [step],
                              slug: slug,
                              title: title,
                              depth: 0,
                              tabLabels: tabSet
                          )
                      }
                  }

                  print("TOTAL_SCREENSHOTS: \(counter)")

                  XCTAssertGreaterThan(counter, 0, "No screenshots were captured")
              }
          }
          SWIFT

          ruby - <<'RUBY'
          require 'xcodeproj'

          project_path = ENV['APP_PROJECT']
          requested = ENV['APP_TARGET'].to_s.strip

          project = Xcodeproj::Project.open(project_path)

          apps = project.targets.select do |target|
            target.product_type == 'com.apple.product-type.application'
          end

          app = apps.find { |target| target.name == requested } || apps.first

          abort 'No iOS application target found' unless app

          puts "Application target: #{app.name}"

          existing = project.targets.find { |target| target.name == 'PreviewUITests' }
          project.targets.delete(existing) if existing

          group = project.main_group['PreviewUITests'] ||
                  project.main_group.new_group('PreviewUITests', 'PreviewUITests')

          source = group.files.find { |file| file.path == 'ScreenshotTests.swift' } ||
                   group.new_file('ScreenshotTests.swift')

          deployment =
            app.build_configurations.first.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] ||
            project.build_configurations.first.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] ||
            '15.0'

          ui = project.new_target(:ui_test_bundle, 'PreviewUITests', :ios, deployment.to_s)

          ui.product_name = 'PreviewUITests'
          ui.add_dependency(app)
          ui.add_file_references([source])

          ui.build_configurations.each do |configuration|
            settings = configuration.build_settings

            settings.delete('TEST_HOST')
            settings.delete('BUNDLE_LOADER')

            settings['PRODUCT_NAME'] = 'PreviewUITests'
            settings['PRODUCT_MODULE_NAME'] = 'PreviewUITests'
            settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.preview.PreviewUITests'
            settings['TEST_TARGET_NAME'] = app.name
            settings['GENERATE_INFOPLIST_FILE'] = 'YES'
            settings['SWIFT_VERSION'] = '5.0'
            settings['IPHONEOS_DEPLOYMENT_TARGET'] = deployment.to_s
            settings['SUPPORTED_PLATFORMS'] = 'iphonesimulator'
            settings['TARGETED_DEVICE_FAMILY'] = '1,2'
            settings['CODE_SIGNING_ALLOWED'] = 'NO'
            settings['CODE_SIGNING_REQUIRED'] = 'NO'
          end

          app_scheme = Xcodeproj::XCScheme.new
          app_scheme.add_build_target(app)
          app_scheme.set_launch_target(app)
          app_scheme.save_as(project_path, 'PreviewApp', true)

          test_scheme = Xcodeproj::XCScheme.new
          test_scheme.add_build_target(app)
          test_scheme.add_test_target(ui)
          test_scheme.set_launch_target(app)
          test_scheme.save_as(project_path, 'PreviewUI', true)

          project.save

          puts 'Created PreviewApp and PreviewUI schemes'
          RUBY

      - name: Resolve Swift packages
        shell: bash
        env:
          KIND: ${{ steps.deps.outputs.kind }}
          CONTAINER: ${{ steps.deps.outputs.container }}
        run: |
          xcodebuild -resolvePackageDependencies \
            "-$KIND" "$CONTAINER" \
            -scheme PreviewUI || true

      - name: Boot iPhone Simulator
        id: boot
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          devices = [
              device
              for group in data["devices"].values()
              for device in group
              if device["isAvailable"]
              and device["name"].startswith("iPhone")
          ]

          pro = [d for d in devices if d["name"].endswith("Pro")]
          selected = pro[0] if pro else (devices[0] if devices else None)

          print(selected["udid"] if selected else "")
          ')

          if [[ -z "$DEVICE_ID" ]]; then
            echo "::error::No available iPhone simulator"
            exit 1
          fi

          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          xcrun simctl status_bar "$DEVICE_ID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100 || true

      - name: Run UI tests and capture screenshots
        id: tests
        continue-on-error: true
        shell: bash
        env:
          DEVICE_ID: ${{ steps.boot.outputs.device_id }}
          KIND: ${{ steps.deps.outputs.kind }}
          CONTAINER: ${{ steps.deps.outputs.container }}
        run: |
          set -uo pipefail

          RESULT_BUNDLE="$RUNNER_TEMP/Preview.xcresult"
          DERIVED="$RUNNER_TEMP/SimulatorBuild"

          rm -rf "$RESULT_BUNDLE" /tmp/PreviewScreenshots

          # arm64 only: Swift packages (e.g. ZIPFoundation) are built for the
          # active architecture, so a dual-arch app build fails to link them.
          xcodebuild test \
            "-$KIND" "$CONTAINER" \
            -scheme PreviewUI \
            -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=arm64" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            > "$GITHUB_WORKSPACE/test.log" 2>&1

          CODE=$?

          echo "UI_TEST_EXIT_CODE=$CODE"

          grep -E "error:|SCREENSHOT_SAVED:|TOTAL_SCREENSHOTS:|Test Case.*(passed|failed)|TEST (SUCCEEDED|FAILED)" \
            "$GITHUB_WORKSPACE/test.log" | tail -120 || true

          exit "$CODE"

      - name: Collect screenshots
        if: always()
        shell: bash
        env:
          DEVICE_ID: ${{ steps.boot.outputs.device_id }}
        run: |
          set -uo pipefail

          OUT="$GITHUB_WORKSPACE/Screenshots"
          DERIVED="$RUNNER_TEMP/SimulatorBuild"
          RESULT_BUNDLE="$RUNNER_TEMP/Preview.xcresult"
          EXPORT="$RUNNER_TEMP/ExportedScreenshots"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          has_images() { compgen -G "$OUT/*.png" > /dev/null; }

          # 1) Folder written directly by the test on the macOS host
          if [[ -d /tmp/PreviewScreenshots ]]; then
            cp /tmp/PreviewScreenshots/*.png "$OUT/" 2>/dev/null || true
            cp /tmp/PreviewScreenshots/index.txt "$OUT/" 2>/dev/null || true
          fi

          # 2) Documents folder inside the XCTest runner container
          if ! has_images && [[ -d "$DERIVED/Build/Products" ]]; then
            while IFS= read -r RUNNER_APP; do
              RUNNER_ID=$(/usr/libexec/PlistBuddy \
                -c 'Print :CFBundleIdentifier' \
                "$RUNNER_APP/Info.plist" 2>/dev/null || true)
              [[ -n "$RUNNER_ID" ]] || continue

              CONTAINER_DIR=$(xcrun simctl get_app_container \
                "$DEVICE_ID" "$RUNNER_ID" data 2>/dev/null || true)
              SOURCE="$CONTAINER_DIR/Documents/PreviewScreenshots"

              if [[ -d "$SOURCE" ]]; then
                cp "$SOURCE/"*.png "$OUT/" 2>/dev/null || true
                cp "$SOURCE/index.txt" "$OUT/" 2>/dev/null || true
              fi
            done < <(find "$DERIVED/Build/Products" -type d -name '*-Runner.app' -print)
          fi

          # 3) Attachments stored in the .xcresult bundle
          if ! has_images && [[ -d "$RESULT_BUNDLE" ]]; then
            mkdir -p "$EXPORT"
            xcrun xcresulttool export attachments \
              --path "$RESULT_BUNDLE" \
              --output-path "$EXPORT" || true

            python3 - "$EXPORT" "$OUT" <<'PY'
          import json, os, re, shutil, sys

          export, out = sys.argv[1], sys.argv[2]
          manifest = os.path.join(export, "manifest.json")
          count = 0

          if os.path.exists(manifest):
              with open(manifest, encoding="utf-8") as f:
                  entries = json.load(f)
              for entry in entries:
                  for att in entry.get("attachments", []):
                      src = os.path.join(export, att.get("exportedFileName", ""))
                      if not src.lower().endswith(".png") or not os.path.exists(src):
                          continue
                      name = att.get("suggestedHumanReadableName", "")
                      name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}.*$", "", name)
                      name = re.sub(r"[^A-Za-z0-9_-]", "-", name) or f"shot-{count + 1}"
                      shutil.copy(src, os.path.join(out, name + ".png"))
                      count += 1

          print(f"Recovered {count} screenshots from xcresult")
          PY
          fi

          echo "Collected screenshots:"
          find "$OUT" -maxdepth 1 -name '*.png' | sort

      - name: Fallback launch screenshot
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DEVICE_ID: ${{ steps.boot.outputs.device_id }}
          KIND: ${{ steps.deps.outputs.kind }}
          CONTAINER: ${{ steps.deps.outputs.container }}
        run: |
          set -uo pipefail

          OUT="$GITHUB_WORKSPACE/Screenshots"

          if compgen -G "$OUT/*.png" > /dev/null; then
            echo "Screenshots already exist. Skipping fallback."
            exit 0
          fi

          DERIVED="$RUNNER_TEMP/FallbackBuild"

          xcodebuild build \
            "-$KIND" "$CONTAINER" \
            -scheme PreviewApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID,arch=arm64" \
            -derivedDataPath "$DERIVED" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO \
            > "$GITHUB_WORKSPACE/fallback-build.log" 2>&1 || {
              echo "::warning::Fallback build failed"
              grep -E "error:" "$GITHUB_WORKSPACE/fallback-build.log" | tail -40 || true
              exit 1
            }

          APP=$(find "$DERIVED/Build/Products" -type d -name '*.app' \
            -not -name '*Runner.app' -print -quit)

          [[ -n "$APP" ]] || { echo "::error::App bundle not found"; exit 1; }

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")

          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 10
          xcrun simctl io "$DEVICE_ID" screenshot "$OUT/00-launch.png"

          echo "00-launch|شاشة البداية" > "$OUT/index.txt"

      - name: Verify screenshots
        id: verify
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/Screenshots"
          mkdir -p "$OUT"

          COUNT=$(find "$OUT" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Total PNG screenshots: $COUNT"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No screenshots were captured. See test.log in the artifact."
            exit 1
          fi

      - name: Shrink images and build gallery
        if: always() && steps.verify.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/Screenshots"

          for file in *.png; do
            [[ -f "$file" ]] || continue
            sips --resampleWidth 600 "$file" >/dev/null || true
          done

          python3 - <<'PY'
          import glob
          import os

          titles = {}

          if os.path.exists("index.txt"):
              with open("index.txt", encoding="utf-8") as f:
                  for line in f:
                      line = line.rstrip("\n")
                      if "|" in line:
                          key, value = line.split("|", 1)
                          titles[key] = value

          names = sorted(os.path.splitext(p)[0] for p in glob.glob("*.png"))

          with open("index.txt", "w", encoding="utf-8") as f:
              for name in names:
                  f.write(f"{name}|{titles.get(name, name)}\n")

          lines = [
              "# لقطات التطبيق",
              "",
              "صور حقيقية تم التقاطها من محاكي iPhone.",
              "",
          ]

          for name in names:
              lines += [
                  "## " + titles.get(name, name),
                  "",
                  f'<img src="{name}.png" width="260">',
                  "",
              ]

          with open("README.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print(f"Gallery created: {len(names)} images")
          PY

      - name: Save screenshots inside the repository
        if: always() && steps.verify.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -f Screenshots

          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi

          git commit -m "Update iPhone simulator screenshots"

          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Simulator-Preview-${{ github.run_number }}
          path: |
            Screenshots/
            test.log
            fallback-build.log
            ${{ runner.temp }}/Preview.xcresult/
          if-no-files-found: warn
          retention-days: 7
