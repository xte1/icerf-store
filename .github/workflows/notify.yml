name: Send notification

on:
  workflow_dispatch:
    inputs:
      title:
        description: "عنوان الرسالة"
        required: true
        default: "i CERF"
      message:
        description: "نص الرسالة"
        required: true
      url:
        description: "رابط يُفتح عند الضغط (اختياري)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add message
        env:
          MSG_TITLE: ${{ inputs.title }}
          MSG_TEXT: ${{ inputs.message }}
          MSG_URL: ${{ inputs.url }}
          MSG_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "icerf-config.json"
          data = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {}
          messages = data.get("messages", [])
          messages.append({
              "id": os.environ["MSG_ID"],
              "title": os.environ["MSG_TITLE"],
              "message": os.environ["MSG_TEXT"],
              "url": os.environ["MSG_URL"]
          })
          data["messages"] = messages[-20:]
          json.dump(data, open(path, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add icerf-config.json
          git commit -m "Send message" || echo "nothing to commit"
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main
          done
